<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WolfSec Forum — The Pack</title>
<style>
  :root {
    --bg: #0a0a0f;
    --accent: #00e5ff;
    --accent2: #7c4dff;
    --text: #e0e0e0;
    --card: rgba(18,18,26,0.9);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    line-height: 1.6;
    background: #000 url('../assets/content (11).jpg') center/cover fixed;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: -1;
  }
  header {
    padding: 1.2rem 2rem;
    border-bottom: 1px solid rgba(0,229,255,0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header a {
    color: var(--accent);
    text-decoration: none;
    font-weight: bold;
    letter-spacing: 3px;
    font-size: 1.1rem;
  }
  header span {
    color: #7c4dff;
    letter-spacing: 4px;
    font-weight: bold;
  }
  .container {
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1.5rem;
  }
  h2 {
    font-size: 2.4rem;
    color: var(--accent);
    margin-bottom: 1.5rem;
    text-align: center;
    text-shadow: 0 0 20px rgba(0,229,255,0.4);
  }
  .thread {
    background: var(--card);
    margin: 1.2rem 0;
    padding: 1.4rem 1.6rem;
    border-radius: 10px;
    border-left: 4px solid var(--accent);
    backdrop-filter: blur(6px);
    transition: transform 0.2s, border-color 0.2s;
  }
  .thread:hover {
    transform: translateX(4px);
    border-left-color: #7c4dff;
  }
  .thread h3 {
    color: #fff;
    margin-bottom: 0.5rem;
    font-size: 1.3rem;
  }
  .thread p {
    margin-bottom: 0.6rem;
    white-space: pre-wrap;
  }
  .thread .meta {
    font-size: 0.8rem;
    color: #888;
  }
  form {
    background: var(--card);
    padding: 1.8rem;
    border-radius: 12px;
    margin: 2.5rem 0;
    border: 1px solid rgba(0,229,255,0.3);
    backdrop-filter: blur(8px);
  }
  form h3 {
    color: var(--accent);
    margin-bottom: 1rem;
  }
  input, textarea {
    width: 100%;
    padding: 0.9rem;
    margin: 0.6rem 0;
    background: rgba(0,0,0,0.5);
    border: 1px solid #333;
    color: #fff;
    border-radius: 6px;
    font-family: inherit;
    font-size: 1rem;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(0,229,255,0.3);
  }
  button {
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    padding: 0.8rem 2rem;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    letter-spacing: 2px;
    transition: all 0.3s;
  }
  button:hover {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 20px var(--accent);
  }
  .empty {
    text-align: center;
    color: #666;
    padding: 2rem;
    font-style: italic;
  }
</style>
</head>
<body>
<header>
  <a href="../">← WOLFSEC</a>
  <span>THE PACK FORUM</span>
</header>
<div class="container">
  <h2>Discussions</h2>
  <div id="threads"></div>
  <form id="newThread">
    <h3>Start a Thread</h3>
    <input type="text" id="title" placeholder="Thread title" required>
    <textarea id="body" rows="5" placeholder="What's on your mind, pack member?" required></textarea>
    <button type="submit">POST</button>
  </form>
</div>
<script>
const KEY = 'wolfsec_forum';
function load() { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }
function render() {
  const threads = load().reverse();
  const el = document.getElementById('threads');
  if (threads.length === 0) {
    el.innerHTML = '<p class="empty">No threads yet. Be the first to howl.</p>';
    return;
  }
  el.innerHTML = threads.map(t => `
    <div class="thread">
      <h3>${escapeHtml(t.title)}</h3>
      <p>${escapeHtml(t.body)}</p>
      <div class="meta">${new Date(t.ts).toLocaleString()} • local to this browser</div>
    </div>
  `).join('');
}
function escapeHtml(s) {
  return s.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
}
document.getElementById('newThread').onsubmit = e => {
  e.preventDefault();
  const threads = load();
  threads.push({
    title: document.getElementById('title').value.trim(),
    body: document.getElementById('body').value.trim(),
    ts: Date.now()
  });
  save(threads);
  e.target.reset();
  render();
};
render();
</script>
</body>
</html>
