<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WolfSec Forum — The Pack</title>
<style>
  :root { --bg:#0a0a0f; --accent:#00e5ff; --accent2:#7c4dff; --text:#e0e0e0; --card:#12121a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  header { padding:1.5rem 2rem; border-bottom:1px solid #222; display:flex; justify-content:space-between; align-items:center; }
  header a { color:var(--accent); text-decoration:none; font-weight:bold; letter-spacing:2px; }
  .container { max-width:900px; margin:2rem auto; padding:0 1rem; }
  .thread { background:var(--card); margin:1rem 0; padding:1.2rem; border-radius:6px; border-left:3px solid var(--accent); }
  .thread h3 { margin-bottom:0.4rem; }
  .thread .meta { font-size:0.85rem; color:#888; }
  form { margin:2rem 0; }
  input, textarea { width:100%; padding:0.8rem; margin:0.5rem 0; background:#1a1a24; border:1px solid #333; color:#fff; border-radius:4px; }
  button { background:var(--accent); color:#000; border:none; padding:0.8rem 1.5rem; font-weight:bold; cursor:pointer; border-radius:4px; }
  button:hover { box-shadow:0 0 15px var(--accent); }
</style>
</head>
<body>
<header>
  <a href="../">← WOLFSEC</a>
  <span>THE PACK FORUM</span>
</header>
<div class="container">
  <h2>Discussions</h2>
  <div id="threads"></div>
  <form id="newThread">
    <h3>Start a Thread</h3>
    <input type="text" id="title" placeholder="Thread title" required>
    <textarea id="body" rows="4" placeholder="What's on your mind, pack member?" required></textarea>
    <button type="submit">Post</button>
  </form>
</div>
<script>
const KEY = 'wolfsec_forum';
function load() { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }
function render() {
  const threads = load().reverse();
  document.getElementById('threads').innerHTML = threads.map(t => `
    <div class="thread">
      <h3>${escapeHtml(t.title)}</h3>
      <p>${escapeHtml(t.body)}</p>
      <div class="meta">${new Date(t.ts).toLocaleString()} • stored locally in your browser</div>
    </div>
  `).join('') || '<p style="color:#666">No threads yet. Be the first.</p>';
}
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
document.getElementById('newThread').onsubmit = e => {
  e.preventDefault();
  const threads = load();
  threads.push({ title: document.getElementById('title').value, body: document.getElementById('body').value, ts: Date.now() });
  save(threads);
  e.target.reset();
  render();
};
render();
</script>
</body>
</html>
